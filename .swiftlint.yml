## Swiftlint: 0.52.4

analyzer_rules:

disabled_rules:
  - accessibility_label_for_image
  - anonymous_argument_in_multiline_closure
  - attributes
  - conditional_returns_on_newline
  - contrasted_opening_brace
  - explicit_acl
  - explicit_enum_raw_value
  - explicit_self
  - explicit_top_level_acl
  - explicit_type_interface
  - file_types_order
  - function_default_parameter_at_end
  - implicitly_unwrapped_optional
  - incompatible_concurrency_annotation
  - indentation_width
  - missing_docs
  - multiline_arguments_brackets
  - multiline_parameters_brackets
  - no_extension_access_modifier
  - no_grouping_extension
  - no_magic_numbers
  - object_literal
  - one_declaration_per_file
  - prefer_nimble
  - private_subject
  - required_deinit
  - switch_case_on_newline
  - vertical_whitespace_opening_braces

opt_in_rules:
  - all

excluded:
  - "**/.build"
  - "**/.swiftpm"
  - "**/Package.swift"

file_length:
    ignore_comment_only_lines: true

function_parameter_count:
    warning: 7
    error: 8

identifier_name:
    excluded:
      - a
      - b
      - dx
      - dy
      - i
      - id
      - p1
      - p2
      - t1
      - t2
      - up
      - x
      - y
    min_length:
        warning: 3
        error: 2

large_tuple:
    warning: 3
    error: 4

line_length:
    warning: 160
    error: 170
    ignores_urls: true
    ignores_interpolated_strings: true

nesting:
    type_level: 2

no_empty_block:
    disabled_block_types:
      - initializer_bodies

number_separator:
    minimum_length: 6
    minimum_fraction_length: 6

trailing_whitespace:
    ignores_comments: false

type_name:
    max_length:
        warning: 50
    excluded:
      - log
      - E
      - T
      - U
      - V
      - W
